[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prow-agent-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "PyGithub>=2.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "agent-eval-harness @ git+https://github.com/opendatahub-io/agent-eval-harness.git@v1.39.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "responses>=0.25"]
llm = ["anthropic>=0.40"]

[project.scripts]
prow-agent-eval-python = "prow_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prow_agent_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring git and network mocks",
]
