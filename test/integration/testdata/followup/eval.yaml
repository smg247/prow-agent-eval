name: followup-eval
description: Integration fixture for review-responder style followup eval
init:
  repo: acme/widget
dataset:
  path: cases
collect:
  bot_replies: true
  comment_map: true
  build_result: false
  test_result: false
  expected_branch_diff: false
judges:
  - name: branch_created
    description: Agent branch exists
    type: branch_created
  - name: pr_exists
    description: PR was created
    type: pr_exists
  - name: pr_description_exists
    description: PR has a description
    type: pr_description_exists
  - name: no_secrets
    description: No secrets leaked
    type: no_secrets
  - name: reply_posted
    description: Bot replied to actionable comments
    type: reply_posted
  - name: scope_creep_declined
    description: Bot declined scope creep
    type: scope_creep_declined
thresholds:
  branch_created:
    min_pass_rate: 1.0
  pr_exists:
    min_pass_rate: 1.0
